<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simon Says Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Symon Says Game</h1>
  <h2>Press any key to start game</h2>
  <div class="container">
    <div class="box-container-1">
      <div class="box red" id="red" type="button"></div>
      <div class="box yellow" id="yellow" type="button"></div>
    </div>
    <div class="box-container-2">
      <div class="box green" id="green" type="button"></div>
      <div class="box blue" id="blue" type="button"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
